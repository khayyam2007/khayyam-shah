<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>BlockCraft — Drag &amp; Drop App Builder</title>
<style>
:root{
  --bg:#0b0b10; --surface:#12121a; --surface2:#1a1a24; --border:rgba(255,255,255,.10);
  --text:#f2f2f7; --muted:#8d8da0; --accent1:#7c6bff; --accent2:#ff6bd8;
  --good:#22c55e; --bad:#ef4444; --warn:#f59e0b;
  --shadow:0 8px 30px rgba(0,0,0,.5);
  --radius:14px;
  --ctlBg:#1a1a24; --ctlBorder:rgba(255,255,255,.12);
}
html[data-theme="light"]{
  --bg:#f3f4fa; --surface:#ffffff; --surface2:#f0f1f8;
  --border:#e4e6f1; --text:#171826; --muted:#68697f;
  --shadow:0 8px 24px rgba(30,40,80,.08);
  --ctlBg:#f7f7fc; --ctlBorder:#e4e6f1;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
html{background:#ffffff;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Arial,sans-serif;
  background:#000000; color:#f2f2f7; transition:background .2s,color .2s;
}
#app{background:var(--bg); color:var(--text);}
button,input,textarea,select{font-family:inherit; color:inherit;}
button{cursor:pointer;}
a{color:inherit;}
::-webkit-scrollbar{width:9px; height:9px;}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:20px;}
::-webkit-scrollbar-track{background:transparent;}

#app{display:flex; flex-direction:column; height:100vh;}

/* ---------- TOPBAR ---------- */
#topbar{
  height:58px; flex:none; display:flex; align-items:center; gap:14px;
  padding:0 16px; border-bottom:1px solid var(--border); background:var(--surface);
  position:sticky; top:0; z-index:80;
}
#brand{display:flex; align-items:center; gap:9px; font-weight:800; font-size:16px; letter-spacing:-.2px; flex:none;}
#brand .mark{
  width:30px; height:30px; border-radius:9px; display:flex; align-items:center; justify-content:center;
  background:#ffffff; color:#000000; font-size:15px; box-shadow:0 4px 14px rgba(0,0,0,.25);
}
#deviceSwitch{
  display:flex; background:var(--surface2); border:1px solid var(--border); border-radius:999px; padding:3px; gap:2px; flex:none;
}
#deviceSwitch button{
  border:none; background:transparent; color:var(--muted); font-size:12.5px; font-weight:700;
  padding:7px 15px; border-radius:999px; transition:.15s;
}
#deviceSwitch button.active{background:#ffffff; color:#000000;}
#topbarRight{display:flex; align-items:center; gap:8px; flex:none; margin-left:auto;}
.iconbtn{
  width:34px; height:34px; border-radius:10px; border:1px solid var(--ctlBorder);
  background:var(--ctlBg); color:var(--text); display:flex; align-items:center; justify-content:center;
  font-size:15px; flex:none;
}
.iconbtn:hover{border-color:var(--accent1);}
.iconbtn.active{border-color:var(--accent1); color:var(--accent1);}
.pillbtn{
  border:1px solid var(--ctlBorder); background:var(--ctlBg); color:var(--text); border-radius:999px;
  padding:8px 15px; font-size:12.5px; font-weight:700; transition:.15s;
}
.pillbtn:hover{border-color:var(--accent1);}
.pillbtn.primary{background:#ffffff; border-color:transparent; color:#000000;}

/* ---------- LAYOUT ---------- */
#layout{flex:1; display:grid; grid-template-columns:230px 1fr 300px; min-height:0;}
#layout.preview #sidebar,#layout.preview #panel{display:none;}
#layout.preview{grid-template-columns:1fr;}
.pane{min-width:0; display:flex; flex-direction:column;}
#sidebar{background:var(--surface); border-right:1px solid var(--border);}
#panel{background:var(--surface); border-left:1px solid var(--border);}
#stage{background:var(--bg); overflow-y:auto;}

.paneHead{
  padding:15px 15px 9px; font-size:10.5px; font-weight:800; text-transform:uppercase;
  letter-spacing:1px; color:var(--muted); flex:none;
}
.paneBody{flex:1; overflow-y:auto; padding:0 13px 16px;}

/* ---------- PALETTE ---------- */
.blockGrid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:7px; margin-bottom:6px;}
.blockCard{
  border:1px solid var(--ctlBorder); background:var(--ctlBg); border-radius:10px; padding:10px 4px;
  font-size:10px; font-weight:700; text-align:center; transition:.15s; display:flex; flex-direction:column;
  align-items:center; gap:5px; cursor:grab;
}
.blockCard .ic{font-size:16px;}
.blockCard:hover{border-color:var(--accent1); transform:translateY(-1px);}
.blockCard:active{cursor:grabbing; opacity:.7;}

.savedItem{
  display:flex; align-items:center; gap:6px; border:1px solid var(--ctlBorder); background:var(--ctlBg);
  border-radius:10px; padding:8px 10px; margin-bottom:8px;
}
.savedItem .name{flex:1; font-size:12px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.savedItem button{border:none; background:transparent; color:var(--muted); font-size:14px; padding:2px 4px;}
.savedItem button:hover{color:var(--accent1);}
.savedItem button.del:hover{color:var(--bad);}
.emptyNote{color:var(--muted); font-size:11.5px; padding:6px 2px; line-height:1.5;}

/* ---------- STAGE ---------- */
#stageInner{padding:32px 20px 80px; display:flex; flex-direction:column; align-items:center;}
.deviceFrame{background:var(--surface); border:1px solid var(--border); box-shadow:var(--shadow); transition:.2s; overflow:hidden;}
.deviceFrame.web{width:min(760px,94vw); border-radius:12px;}
.deviceFrame.mobile{width:380px; border-radius:34px; padding:10px; background:#050508;}
html[data-theme="light"] .deviceFrame.mobile{background:#111;}
.webChrome{
  height:36px; background:var(--surface2); display:flex; align-items:center; gap:8px; padding:0 12px; border-bottom:1px solid var(--border);
}
.webChrome .dot{width:10px; height:10px; border-radius:50%;}
.webChrome .bar{
  flex:1; margin-left:8px; height:20px; border-radius:999px; background:var(--ctlBg);
  color:var(--muted); font-size:10.5px; display:flex; align-items:center; padding:0 12px;
}
.phoneScreen{background:var(--surface); border-radius:24px; overflow:hidden; position:relative;}
.phoneNotch{
  position:absolute; top:0; left:50%; transform:translateX(-50%); width:120px; height:20px;
  background:#050508; border-radius:0 0 14px 14px; z-index:5;
}
html[data-theme="light"] .phoneNotch{background:#111;}
.statusBar{height:36px; flex:none; display:flex; align-items:center; justify-content:space-between; padding:0 22px; font-size:10.5px; font-weight:700;}

/* canvas / root drop zone */
#canvasRoot{min-height:420px; padding:10px; position:relative;}
#canvasRoot.rootSelected{outline:2px solid var(--accent1); outline-offset:-2px;}
.emptyCanvas{
  min-height:300px; display:flex; align-items:center; justify-content:center; text-align:center;
  color:var(--muted); font-size:13px; border:2px dashed var(--ctlBorder); border-radius:12px; padding:30px; line-height:1.6;
}

/* ---------- BLOCK WRAPPER ---------- */
.blk{position:relative; min-height:20px;}
.blk>.blkInner{outline:1px dashed transparent; outline-offset:2px; border-radius:6px; transition:outline-color .1s;}
.blk:hover>.blkInner{outline-color:rgba(124,107,255,.35);}
.blk.selected>.blkInner{outline:2px solid var(--accent1); outline-offset:2px;}
#layout.preview .blk>.blkInner{outline:none !important;}

.blkToolbar{
  position:absolute; top:-13px; right:4px; display:none; gap:3px; z-index:30;
}
.blk.selected>.blkToolbar,.blk:hover>.blkToolbar{display:flex;}
#layout.preview .blkToolbar{display:none !important;}
.blkToolbar button{
  width:22px; height:22px; border-radius:6px; border:1px solid var(--ctlBorder); background:var(--surface);
  color:var(--text); font-size:11px; display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow);
}
.blkToolbar button:hover{border-color:var(--accent1);}
.blkToolbar button.del:hover{color:var(--bad); border-color:var(--bad);}
.blkToolbar .handle{cursor:grab;}

.blk.dragOverTop>.blkInner{box-shadow:0 -3px 0 0 var(--accent2);}
.blk.dragOverBottom>.blkInner{box-shadow:0 3px 0 0 var(--accent2);}
.blk.dragOverIn>.blkInner{outline:2px solid var(--accent2) !important;}

/* container block */
.blkContainer{display:flex; gap:12px; padding:14px; border-radius:8px; min-height:44px;}
.blkContainer.empty{align-items:center; justify-content:center; color:var(--muted); font-size:11.5px; border:1.5px dashed var(--ctlBorder);}
.blkContainer>.blk{flex:1; min-width:0;}

/* content elements */
.blkButton{border:none; outline:none; font-family:inherit; cursor:default; display:inline-flex; align-items:center; justify-content:center;}
.blkImage{max-width:100%; display:block; object-fit:cover;}
.blkDivider{width:100%;}
.blkAlignWrap{display:flex; width:100%;}

/* ---------- PROPERTIES PANEL ---------- */
.propGroup{margin-bottom:16px;}
.propLabel{font-size:11px; font-weight:700; color:var(--muted); margin-bottom:6px; display:flex; justify-content:space-between;}
.propRow{display:flex; gap:8px; margin-bottom:8px;}
.fieldFull input[type=text],.fieldFull textarea,.fieldFull select{
  width:100%; border:1px solid var(--ctlBorder); background:var(--ctlBg); color:var(--text);
  border-radius:8px; padding:8px 10px; font-size:12.5px;
}
.fieldFull textarea{resize:vertical; min-height:60px;}
.rangeRow{display:flex; align-items:center; gap:8px;}
.rangeRow .v{font-size:11px; color:var(--muted); width:40px; text-align:right; flex:none;}

input[type=range]{
  flex:1; -webkit-appearance:none; appearance:none; width:100%; height:18px; background:transparent; cursor:pointer;
}
input[type=range]:focus{outline:none;}
input[type=range]::-webkit-slider-runnable-track{
  height:5px; border-radius:999px; background:var(--ctlBorder);
}
input[type=range]::-moz-range-track{
  height:5px; border-radius:999px; background:var(--ctlBorder);
}
input[type=range]::-moz-range-progress{
  height:5px; border-radius:999px; background:#ffffff;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none; appearance:none; margin-top:-6.5px;
  width:16px; height:16px; border-radius:50%;
  background:#ffffff; border:2px solid #000000;
  box-shadow:0 1px 4px rgba(0,0,0,.4);
  transition:transform .1s;
}
input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.12);}
input[type=range]::-webkit-slider-thumb:active{transform:scale(1.2);}
input[type=range]::-moz-range-thumb{
  width:16px; height:16px; border-radius:50%;
  background:#ffffff; border:2px solid #000000;
  box-shadow:0 1px 4px rgba(0,0,0,.4);
}
.colorField{display:flex; align-items:center; gap:6px;}
.colorField input[type=color]{width:32px; height:32px; border:1px solid var(--ctlBorder); border-radius:8px; background:none; padding:2px;}
.colorField input[type=text]{flex:1; border:1px solid var(--ctlBorder); background:var(--ctlBg); color:var(--text); border-radius:8px; padding:7px 9px; font-size:12px;}
.segRow{display:flex; background:var(--ctlBg); border:1px solid var(--ctlBorder); border-radius:9px; padding:2px; gap:2px;}
.segBtn{flex:1; border:none; background:transparent; color:var(--muted); font-size:11.5px; font-weight:700; padding:7px 4px; border-radius:7px;}
.segBtn.active{background:#ffffff; color:#000000;}
.propEmpty{color:var(--muted); font-size:12.5px; padding:20px 4px; line-height:1.6; text-align:center;}
.propEmpty .ic{font-size:26px; display:block; margin-bottom:8px;}
.deleteFull{
  width:100%; border:1px solid rgba(239,68,68,.4); background:rgba(239,68,68,.08); color:var(--bad);
  border-radius:9px; padding:9px; font-size:12.5px; font-weight:700; margin-top:6px;
}
.deleteFull:hover{background:rgba(239,68,68,.16);}

#toast{
  position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--surface);
  border:1px solid var(--border); box-shadow:var(--shadow); padding:10px 18px; border-radius:999px; font-size:12.5px;
  font-weight:700; opacity:0; pointer-events:none; transition:.2s; z-index:200;
}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

@media(max-width:880px){
  #layout{grid-template-columns:1fr; grid-template-rows:auto 1fr auto;}
  #sidebar{border-right:none; border-bottom:1px solid var(--border); max-height:150px;}
  #panel{border-left:none; border-top:1px solid var(--border); max-height:40vh;}
}
</style>
</head>
<body>
<div id="app">

  <div id="topbar">
    <div id="brand"><span class="mark">🧱</span>BlockCraft</div>
    <div id="deviceSwitch">
      <button id="devWeb" class="active" onclick="setDevice('web')">Web</button>
      <button id="devMobile" onclick="setDevice('mobile')">Mobile</button>
    </div>
    <div id="topbarRight">
      <button class="iconbtn" id="previewBtnTop" title="Preview" onclick="togglePreview()">👁</button>
      <button class="pillbtn" onclick="newProject()">New</button>
      <button class="pillbtn" onclick="saveProject()">Save</button>
      <button class="pillbtn primary" onclick="clearSelectionHint()">Done</button>
      <button class="iconbtn" id="themeBtn" title="Theme" onclick="toggleTheme()">🌙</button>
    </div>
  </div>

  <div id="layout">
    <div class="pane" id="sidebar">
      <div class="paneHead">Blocks</div>
      <div class="paneBody">
        <div class="blockGrid" id="blockPalette"></div>

        <div class="paneHead" style="padding-left:0;">Saved Pages</div>
        <div id="savedList"></div>
      </div>
    </div>

    <div class="pane" id="stage">
      <div id="stageInner">
        <div class="deviceFrame web" id="deviceFrame">
          <div class="webChrome" id="webChrome">
            <div class="dot" style="background:#ff5f56;"></div>
            <div class="dot" style="background:#ffbd2e;"></div>
            <div class="dot" style="background:#27c93f;"></div>
            <div class="bar">myapp.com</div>
          </div>
          <div class="phoneNotch" id="phoneNotch" style="display:none;"></div>
          <div class="statusBar" id="statusBar" style="display:none;"><span>9:41</span><span>••• 🔋</span></div>
          <div id="canvasRoot"></div>
        </div>
      </div>
    </div>

    <div class="pane" id="panel">
      <div class="paneHead">Properties</div>
      <div class="paneBody" id="propBody"></div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
/* ================= DATA MODEL ================= */
let uid = 0;
function nid(){ return 'b'+(++uid)+'_'+Date.now().toString(36); }

const blockDefs = [
  {type:'container', label:'Layout Row', ic:'▦', make:()=>({direction:'row', gap:14, padding:16, align:'stretch', justify:'flex-start', bg:'transparent', minH:60})},
  {type:'columns2', label:'2 Columns', ic:'☰', columns:2},
  {type:'columns3', label:'3 Columns', ic:'⯐', columns:3},
  {type:'heading', label:'Heading', ic:'H', make:()=>({content:'Your Heading', tag:'h2', fontSize:28, color:'var(--text)', align:'left', weight:800})},
  {type:'text', label:'Text', ic:'¶', make:()=>({content:'A short paragraph of body text goes here. Click to edit it from the panel on the right.', fontSize:14.5, color:'var(--muted)', align:'left', weight:400})},
  {type:'button', label:'Button', ic:'▭', make:()=>({label:'Click Me', bg:'#7c6bff', color:'#ffffff', radius:10, padX:20, padY:12, align:'left', fontSize:14, fweight:700})},
  {type:'link', label:'Link', ic:'🔗', make:()=>({content:'Learn more →', href:'#', color:'#7c6bff', fontSize:14, weight:700, underline:true, align:'left'})},
  {type:'image', label:'Image', ic:'🖼', make:()=>({src:'https://picsum.photos/seed/blockcraft/640/360', alt:'Image', radius:12, width:100, fit:'cover'})},
  {type:'video', label:'Video', ic:'▶', make:()=>({src:'https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4', radius:12, width:100, controls:true})},
  {type:'list', label:'List', ic:'☰', make:()=>({items:['First item','Second item','Third item'], ordered:false, color:'var(--text)', fontSize:14, gap:8})},
  {type:'quote', label:'Quote', ic:'❝', make:()=>({content:'Design is not just what it looks like. Design is how it works.', color:'var(--text)', fontSize:17, borderColor:'#7c6bff'})},
  {type:'code', label:'Code', ic:'&lt;/&gt;', make:()=>({content:'console.log("hello world");', fontSize:13, color:'#7cf7c9', bg:'#0c0c12'})},
  {type:'table', label:'Table', ic:'▤', make:()=>({rows:[['Column A','Column B'],['Row 1','Row 1'],['Row 2','Row 2']], header:true, color:'var(--text)'})},
  {type:'input', label:'Input', ic:'▯', make:()=>({label:'Email', placeholder:'you@example.com'})},
  {type:'textarea', label:'Textarea', ic:'▭', make:()=>({label:'Message', placeholder:'Write a message…'})},
  {type:'checkbox', label:'Checkbox', ic:'☑', make:()=>({label:'I agree to the terms', checked:false})},
  {type:'badge', label:'Badge', ic:'●', make:()=>({label:'New', bg:'#22c55e', color:'#04140a'})},
  {type:'alert', label:'Alert', ic:'▲', make:()=>({content:'Heads up — this is an alert message.', variant:'info'})},
  {type:'progress', label:'Progress', ic:'▬', make:()=>({value:60, color:'#7c6bff', track:'#1a1a24', height:10})},
  {type:'icon', label:'Icon', ic:'★', make:()=>({glyph:'★', size:28, color:'#7c6bff', align:'left'})},
  {type:'divider', label:'Divider', ic:'―', make:()=>({color:'var(--border)', margin:14, thickness:1})},
  {type:'spacer', label:'Spacer', ic:'⬚', make:()=>({height:28})},
];

const defaultAdv = ()=>({mt:0, mb:0, opacity:100, borderW:0, borderColor:'#7c6bff', borderStyle:'solid', radius:0, shadow:false, shadowBlur:18, shadowY:6, shadowColor:'#000000'});

function makeContainer(dir='column', extra={}){
  return {id:nid(), type:'container', props:{direction:dir, gap:14, padding:16, align:'stretch', justify:'flex-start', bg:'transparent', minH:60, adv:defaultAdv(), ...extra}, children:[]};
}
function makeBlock(type){
  const def = blockDefs.find(d=>d.type===type);
  if(type==='columns2' || type==='columns3'){
    const n = type==='columns2'?2:3;
    const row = makeContainer('row', {gap:16, padding:0, bg:'transparent', minH:40});
    for(let i=0;i<n;i++){ row.children.push(makeContainer('column', {gap:10, padding:14, bg:'var(--surface2)', minH:80})); }
    return row;
  }
  return {id:nid(), type, props: {...def.make(), adv: defaultAdv()}, children: type==='container' ? [] : undefined};
}

let root = makeContainer('column', {padding:24, gap:18, minH:400, bg:'transparent'});
let selectedId = 'root';
let device = 'web';
let previewMode = false;
let dragData = null; // {kind:'new', type} | {kind:'move', id}

const $ = id => document.getElementById(id);

/* ================= TREE HELPERS ================= */
function findIn(node, id){
  if(node.id===id) return {block:node, parent:null, arr:null, idx:-1};
  if(!node.children) return null;
  for(let i=0;i<node.children.length;i++){
    const c = node.children[i];
    if(c.id===id) return {block:c, parent:node, arr:node.children, idx:i};
    const found = findIn(c, id);
    if(found) return found;
  }
  return null;
}
function isDescendant(node, ancestorId){
  if(node.id===ancestorId) return true;
  if(!node.children) return false;
  return node.children.some(c=>isDescendant(c, ancestorId));
}
function removeById(id){
  const f = findIn(root, id);
  if(f && f.arr) f.arr.splice(f.idx,1);
  return f;
}
function cloneBlock(b){
  const c = JSON.parse(JSON.stringify(b));
  const relabel = n=>{ n.id = nid(); if(n.children) n.children.forEach(relabel); };
  relabel(c);
  return c;
}

/* ================= PALETTE ================= */
function renderPalette(){
  const wrap = $('blockPalette');
  wrap.innerHTML = '';
  blockDefs.forEach(def=>{
    const card = document.createElement('div');
    card.className = 'blockCard';
    card.draggable = true;
    card.innerHTML = `<span class="ic">${def.ic}</span>${def.label}`;
    card.ondragstart = e=>{ dragData = {kind:'new', type:def.type}; e.dataTransfer.effectAllowed='copy'; e.dataTransfer.setData('text/plain','new'); };
    wrap.appendChild(card);
  });
}

/* ================= RENDER CANVAS ================= */
function render(){
  renderCanvasTree();
  renderProps();
}
function renderCanvasTree(){
  const canvasRoot = $('canvasRoot');
  canvasRoot.innerHTML = '';
  canvasRoot.classList.toggle('rootSelected', selectedId==='root' && !previewMode);
  canvasRoot.style.padding = root.props.padding+'px';
  canvasRoot.style.display = 'flex';
  canvasRoot.style.flexDirection = root.props.direction==='row'?'row':'column';
  canvasRoot.style.gap = root.props.gap+'px';
  canvasRoot.style.background = root.props.bg;
  canvasRoot.onclick = e=>{ if(e.target===canvasRoot){ selectedId='root'; renderProps(); } };
  canvasRoot.ondragover = e=>{ e.preventDefault(); };
  canvasRoot.ondrop = e=>{ if(e.target===canvasRoot){ e.preventDefault(); handleDrop(dragData, 'root', 'in'); } };

  if(root.children.length===0){
    const empty = document.createElement('div');
    empty.className = 'emptyCanvas';
    empty.textContent = previewMode ? 'This page is empty.' : 'Drag blocks here from the left panel to start building your page.';
    canvasRoot.appendChild(empty);
  } else {
    root.children.forEach(child=> canvasRoot.appendChild(renderBlock(child)));
  }
}

function renderBlock(block){
  const wrap = document.createElement('div');
  wrap.className = 'blk' + (block.id===selectedId?' selected':'');
  wrap.dataset.id = block.id;
  wrap.draggable = !previewMode;

  wrap.onclick = e=>{ e.stopPropagation(); selectedId = block.id; renderProps(); document.querySelectorAll('.blk').forEach(el=>el.classList.toggle('selected', el.dataset.id===block.id)); };

  if(!previewMode){
    const toolbar = document.createElement('div');
    toolbar.className = 'blkToolbar';
    toolbar.innerHTML = `<button class="handle" title="Drag">✥</button><button class="dup" title="Duplicate">⧉</button><button class="del" title="Delete">🗑</button>`;
    toolbar.querySelector('.dup').onclick = e=>{ e.stopPropagation(); duplicateBlock(block.id); };
    toolbar.querySelector('.del').onclick = e=>{ e.stopPropagation(); deleteBlock(block.id); };
    wrap.appendChild(toolbar);

    wrap.ondragstart = e=>{ e.stopPropagation(); dragData = {kind:'move', id:block.id}; e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain','move'); };
    wrap.ondragover = e=>{
      e.preventDefault(); e.stopPropagation();
      const r = wrap.getBoundingClientRect();
      const withinContainer = block.type==='container';
      const relY = (e.clientY - r.top)/r.height;
      wrap.classList.remove('dragOverTop','dragOverBottom','dragOverIn');
      if(withinContainer && relY>0.28 && relY<0.72){ wrap.classList.add('dragOverIn'); }
      else if(relY<=0.28){ wrap.classList.add('dragOverTop'); }
      else{ wrap.classList.add('dragOverBottom'); }
    };
    wrap.ondragleave = ()=>{ wrap.classList.remove('dragOverTop','dragOverBottom','dragOverIn'); };
    wrap.ondrop = e=>{
      e.preventDefault(); e.stopPropagation();
      let pos = 'before';
      if(wrap.classList.contains('dragOverIn')) pos='in';
      else if(wrap.classList.contains('dragOverBottom')) pos='after';
      wrap.classList.remove('dragOverTop','dragOverBottom','dragOverIn');
      handleDrop(dragData, block.id, pos);
    };
  }

  const inner = document.createElement('div');
  inner.className = 'blkInner';
  const adv = block.props && block.props.adv;
  if(adv){
    inner.style.marginTop = adv.mt+'px';
    inner.style.marginBottom = adv.mb+'px';
    inner.style.opacity = (adv.opacity/100);
    if(adv.borderW>0){ inner.style.border = adv.borderW+'px '+adv.borderStyle+' '+adv.borderColor; }
    if(adv.radius>0){ inner.style.borderRadius = adv.radius+'px'; inner.style.overflow='hidden'; }
    if(adv.shadow){ inner.style.boxShadow = '0 '+adv.shadowY+'px '+adv.shadowBlur+'px 0 '+adv.shadowColor; }
  }
  inner.appendChild(renderContent(block));
  wrap.appendChild(inner);
  return wrap;
}

function makeEditable(el, block, commitFn, multiline){
  if(previewMode) return;
  el.contentEditable = 'true';
  el.spellcheck = false;
  el.style.outline = 'none';
  el.style.cursor = 'text';
  if(multiline) el.style.whiteSpace = 'pre-wrap';
  el.addEventListener('mousedown', e=> e.stopPropagation());
  el.addEventListener('dragstart', e=> e.stopPropagation());
  el.addEventListener('focus', ()=>{ const w = el.closest('.blk'); if(w) w.draggable = false; });
  el.addEventListener('blur', ()=>{
    const w = el.closest('.blk'); if(w) w.draggable = true;
    commitFn(el.textContent);
    if(selectedId===block.id) renderProps();
  });
  if(!multiline){
    el.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); el.blur(); } });
  }
}

function renderContent(block){
  const p = block.props;
  if(block.type==='container'){
    const c = document.createElement('div');
    c.className = 'blkContainer' + (block.children.length===0?' empty':'');
    c.style.flexDirection = p.direction==='row' ? 'row':'column';
    c.style.gap = p.gap+'px';
    c.style.padding = p.padding+'px';
    c.style.alignItems = p.align;
    c.style.justifyContent = p.justify;
    c.style.background = p.bg;
    c.style.minHeight = p.minH+'px';
    if(block.children.length===0){
      c.textContent = previewMode ? '' : 'Empty layout block — drag items in';
    } else {
      block.children.forEach(ch=> c.appendChild(renderBlock(ch)));
    }
    return c;
  }
  if(block.type==='heading' || block.type==='text'){
    const el = document.createElement(block.type==='heading'?(p.tag||'h2'):'p');
    el.textContent = p.content;
    el.style.fontSize = p.fontSize+'px';
    el.style.color = p.color;
    el.style.textAlign = p.align;
    el.style.fontWeight = p.weight;
    el.style.lineHeight = '1.5';
    makeEditable(el, block, v=>{ p.content=v; });
    return el;
  }
  if(block.type==='button'){
    const wrap = document.createElement('div');
    wrap.className = 'blkAlignWrap';
    wrap.style.justifyContent = p.align==='left'?'flex-start':p.align==='right'?'flex-end':'center';
    const btn = document.createElement('button');
    btn.className = 'blkButton';
    btn.textContent = p.label;
    btn.style.background = p.bg;
    btn.style.color = p.color;
    btn.style.borderRadius = p.radius+'px';
    btn.style.padding = p.padY+'px '+p.padX+'px';
    btn.style.fontSize = p.fontSize+'px';
    btn.style.fontWeight = p.fweight;
    makeEditable(btn, block, v=>{ p.label=v; });
    wrap.appendChild(btn);
    return wrap;
  }
  if(block.type==='link'){
    const wrap = document.createElement('div');
    wrap.style.textAlign = p.align;
    const a = document.createElement('a');
    a.textContent = p.content;
    a.href = p.href || '#';
    a.onclick = e=> previewMode ? null : e.preventDefault();
    a.style.color = p.color;
    a.style.fontSize = p.fontSize+'px';
    a.style.fontWeight = p.weight;
    a.style.textDecoration = p.underline ? 'underline' : 'none';
    makeEditable(a, block, v=>{ p.content=v; });
    wrap.appendChild(a);
    return wrap;
  }
  if(block.type==='image'){
    const img = document.createElement('img');
    img.className = 'blkImage';
    img.src = p.src;
    img.alt = p.alt;
    img.style.borderRadius = p.radius+'px';
    img.style.width = p.width+'%';
    img.style.objectFit = p.fit;
    return img;
  }
  if(block.type==='video'){
    const v = document.createElement('video');
    v.src = p.src;
    v.controls = p.controls;
    v.style.width = p.width+'%';
    v.style.borderRadius = p.radius+'px';
    v.style.display = 'block';
    return v;
  }
  if(block.type==='list'){
    const el = document.createElement(p.ordered ? 'ol' : 'ul');
    el.style.color = p.color;
    el.style.fontSize = p.fontSize+'px';
    el.style.paddingLeft = '22px';
    el.style.display = 'flex';
    el.style.flexDirection = 'column';
    el.style.gap = p.gap+'px';
    p.items.forEach(t=>{ const li=document.createElement('li'); li.textContent=t; el.appendChild(li); });
    return el;
  }
  if(block.type==='quote'){
    const bq = document.createElement('blockquote');
    bq.textContent = p.content;
    bq.style.color = p.color;
    bq.style.fontSize = p.fontSize+'px';
    bq.style.fontStyle = 'italic';
    bq.style.lineHeight = '1.6';
    bq.style.borderLeft = '3px solid '+p.borderColor;
    bq.style.paddingLeft = '16px';
    bq.style.margin = '0';
    makeEditable(bq, block, v=>{ p.content=v; });
    return bq;
  }
  if(block.type==='code'){
    const pre = document.createElement('pre');
    pre.style.background = p.bg;
    pre.style.color = p.color;
    pre.style.padding = '14px 16px';
    pre.style.borderRadius = '10px';
    pre.style.overflowX = 'auto';
    pre.style.fontSize = p.fontSize+'px';
    const code = document.createElement('code');
    code.style.fontFamily = 'SFMono-Regular,Consolas,Menlo,monospace';
    code.textContent = p.content;
    makeEditable(code, block, v=>{ p.content=v; }, true);
    pre.appendChild(code);
    return pre;
  }
  if(block.type==='table'){
    const table = document.createElement('table');
    table.style.width = '100%';
    table.style.borderCollapse = 'collapse';
    table.style.color = p.color;
    table.style.fontSize = '13px';
    p.rows.forEach((row,ri)=>{
      const tr = document.createElement('tr');
      row.forEach(cellText=>{
        const cell = document.createElement(p.header && ri===0 ? 'th' : 'td');
        cell.textContent = cellText;
        cell.style.border = '1px solid var(--ctlBorder)';
        cell.style.padding = '8px 10px';
        cell.style.textAlign = 'left';
        if(p.header && ri===0){ cell.style.fontWeight='800'; cell.style.background='var(--ctlBg)'; }
        tr.appendChild(cell);
      });
      table.appendChild(tr);
    });
    return table;
  }
  if(block.type==='input'){
    const wrap = document.createElement('div');
    wrap.style.cssText = 'display:flex;flex-direction:column;gap:6px;';
    const lab = document.createElement('label'); lab.textContent = p.label; lab.style.cssText='font-size:12.5px;font-weight:700;color:var(--muted);';
    const inp = document.createElement('input'); inp.type='text'; inp.placeholder = p.placeholder; inp.disabled = !previewMode;
    inp.style.cssText = 'width:100%;padding:10px 12px;border-radius:9px;border:1px solid var(--ctlBorder);background:var(--ctlBg);color:var(--text);font-size:13.5px;';
    wrap.appendChild(lab); wrap.appendChild(inp);
    return wrap;
  }
  if(block.type==='textarea'){
    const wrap = document.createElement('div');
    wrap.style.cssText = 'display:flex;flex-direction:column;gap:6px;';
    const lab = document.createElement('label'); lab.textContent = p.label; lab.style.cssText='font-size:12.5px;font-weight:700;color:var(--muted);';
    const ta = document.createElement('textarea'); ta.placeholder = p.placeholder; ta.disabled = !previewMode; ta.rows=3;
    ta.style.cssText = 'width:100%;padding:10px 12px;border-radius:9px;border:1px solid var(--ctlBorder);background:var(--ctlBg);color:var(--text);font-size:13.5px;resize:vertical;';
    wrap.appendChild(lab); wrap.appendChild(ta);
    return wrap;
  }
  if(block.type==='checkbox'){
    const wrap = document.createElement('label');
    wrap.style.cssText = 'display:flex;align-items:center;gap:8px;font-size:13.5px;cursor:default;';
    const cb = document.createElement('input'); cb.type='checkbox'; cb.checked = p.checked; cb.disabled = !previewMode;
    cb.style.cssText = 'width:16px;height:16px;';
    const span = document.createElement('span'); span.textContent = p.label;
    wrap.appendChild(cb); wrap.appendChild(span);
    return wrap;
  }
  if(block.type==='badge'){
    const wrap = document.createElement('div');
    const b = document.createElement('span');
    b.textContent = p.label;
    b.style.cssText = `display:inline-block;background:${p.bg};color:${p.color};font-size:12px;font-weight:800;padding:5px 12px;border-radius:999px;`;
    makeEditable(b, block, v=>{ p.label=v; });
    wrap.appendChild(b);
    return wrap;
  }
  if(block.type==='alert'){
    const variants = {info:{bg:'rgba(124,107,255,.12)',border:'#7c6bff',ic:'ℹ'},success:{bg:'rgba(34,197,94,.12)',border:'#22c55e',ic:'✓'},warning:{bg:'rgba(245,158,11,.12)',border:'#f59e0b',ic:'⚠'},danger:{bg:'rgba(239,68,68,.12)',border:'#ef4444',ic:'⛔'}};
    const v = variants[p.variant] || variants.info;
    const wrap = document.createElement('div');
    wrap.style.cssText = `display:flex;gap:10px;align-items:flex-start;background:${v.bg};border:1px solid ${v.border};border-radius:10px;padding:12px 14px;`;
    const ic = document.createElement('span'); ic.textContent = v.ic; ic.style.cssText = `color:${v.border};font-weight:800;`;
    const txt = document.createElement('span'); txt.textContent = p.content; txt.style.cssText = 'font-size:13.5px;line-height:1.5;color:var(--text);flex:1;';
    makeEditable(txt, block, val=>{ p.content=val; }, true);
    wrap.appendChild(ic); wrap.appendChild(txt);
    return wrap;
  }
  if(block.type==='progress'){
    const wrap = document.createElement('div');
    wrap.style.cssText = `width:100%;height:${p.height}px;border-radius:999px;background:${p.track};overflow:hidden;`;
    const bar = document.createElement('div');
    bar.style.cssText = `height:100%;width:${p.value}%;border-radius:999px;background:${p.color};`;
    wrap.appendChild(bar);
    return wrap;
  }
  if(block.type==='icon'){
    const wrap = document.createElement('div');
    wrap.style.cssText = `display:flex;justify-content:${p.align==='left'?'flex-start':p.align==='right'?'flex-end':'center'};`;
    const ic = document.createElement('span');
    ic.textContent = p.glyph;
    ic.style.cssText = `font-size:${p.size}px;color:${p.color};line-height:1;`;
    wrap.appendChild(ic);
    return wrap;
  }
  if(block.type==='divider'){
    const hr = document.createElement('div');
    hr.className = 'blkDivider';
    hr.style.borderTop = p.thickness+'px solid '+p.color;
    hr.style.margin = p.margin+'px 0';
    return hr;
  }
  if(block.type==='spacer'){
    const sp = document.createElement('div');
    sp.style.height = p.height+'px';
    return sp;
  }
  return document.createElement('div');
}

/* ================= DROP HANDLING ================= */
function handleDrop(data, targetId, pos){
  if(!data) return;
  let block;
  if(data.kind==='new'){
    block = makeBlock(data.type);
  } else {
    if(data.id===targetId){ dragData=null; return; }
    const targetInfo = findIn(root, targetId);
    if(targetInfo && isDescendant(findIn(root,data.id).block, targetId)){ dragData=null; return; } // can't drop into own descendant
    const removed = removeById(data.id);
    if(!removed){ dragData=null; return; }
    block = removed.block;
  }

  if(targetId==='root'){
    root.children.push(block);
    dragData=null; selectedId=block.id; render(); return;
  }
  const info = findIn(root, targetId);
  if(!info){ dragData=null; return; }

  if(pos==='in' && info.block.type==='container'){
    info.block.children.push(block);
  } else {
    const parentArr = info.parent ? info.parent.children : root.children;
    let idx = parentArr.indexOf(info.block);
    if(pos==='after') idx++;
    parentArr.splice(idx,0,block);
  }
  dragData = null;
  selectedId = block.id;
  render();
}

function duplicateBlock(id){
  const info = findIn(root, id);
  if(!info) return;
  const arr = info.parent ? info.parent.children : root.children;
  const idx = arr.indexOf(info.block);
  const copy = cloneBlock(info.block);
  arr.splice(idx+1,0,copy);
  selectedId = copy.id;
  render();
}
function deleteBlock(id){
  const removed = removeById(id);
  if(removed){ selectedId = removed.parent ? removed.parent.id : 'root'; render(); }
}

/* ================= PROPERTIES PANEL ================= */
function renderProps(){
  const body = $('propBody');
  body.innerHTML = '';
  const isRoot = selectedId==='root';
  const block = isRoot ? root : findIn(root, selectedId)?.block;
  if(!block){ selectedId='root'; return renderProps(); }
  const p = block.props;

  function group(labelText, fieldsEl){
    const g = document.createElement('div');
    g.className = 'propGroup';
    const l = document.createElement('div'); l.className='propLabel'; l.textContent = labelText;
    g.appendChild(l); g.appendChild(fieldsEl);
    body.appendChild(g);
    return g;
  }
  function textField(val, onInput){
    const box = document.createElement('div'); box.className='fieldFull';
    const inp = document.createElement('textarea'); inp.value = val;
    inp.oninput = ()=>{ onInput(inp.value); renderCanvasOnly(); };
    box.appendChild(inp); return box;
  }
  function rangeField(val,min,max,step,unit,onInput){
    const row = document.createElement('div'); row.className='rangeRow';
    const inp = document.createElement('input'); inp.type='range'; inp.min=min; inp.max=max; inp.step=step; inp.value=val;
    const v = document.createElement('span'); v.className='v'; v.textContent = val+unit;
    inp.oninput = ()=>{ v.textContent = inp.value+unit; onInput(parseFloat(inp.value)); renderCanvasOnly(); };
    row.appendChild(inp); row.appendChild(v); return row;
  }
  function colorField(val,onInput){
    const row = document.createElement('div'); row.className='colorField';
    const safe = /^#/.test(val) ? val : '#7c6bff';
    const c = document.createElement('input'); c.type='color'; c.value=safe;
    const t = document.createElement('input'); t.type='text'; t.value=val;
    c.oninput = ()=>{ t.value=c.value; onInput(c.value); renderCanvasOnly(); };
    t.oninput = ()=>{ onInput(t.value); renderCanvasOnly(); };
    row.appendChild(c); row.appendChild(t); return row;
  }
  function segField(options, val, onPick){
    const row = document.createElement('div'); row.className='segRow';
    options.forEach(opt=>{
      const b = document.createElement('button'); b.className='segBtn'+(opt.v===val?' active':''); b.textContent=opt.label; b.type='button';
      b.onclick = ()=>{ onPick(opt.v); renderProps(); renderCanvasOnly(); };
      row.appendChild(b);
    });
    return row;
  }
  function selectField(options, val, onPick){
    const box = document.createElement('div'); box.className='fieldFull';
    const sel = document.createElement('select');
    options.forEach(o=>{ const op=document.createElement('option'); op.value=o; op.textContent=o; if(o===val) op.selected=true; sel.appendChild(op); });
    sel.onchange = ()=>{ onPick(sel.value); renderCanvasOnly(); };
    box.appendChild(sel); return box;
  }

  function toggleField(val,onPick){
    return segField([{v:true,label:'On'},{v:false,label:'Off'}], val, onPick);
  }

  const title = document.createElement('div');
  title.style.cssText = 'font-size:13px;font-weight:800;margin-bottom:14px;display:flex;align-items:center;gap:6px;';
  title.innerHTML = `<span>${isRoot ? '📄 Page' : blockLabel(block.type)}</span>`;
  body.appendChild(title);

  if(isRoot || block.type==='container'){
    group('Direction', segField([{v:'column',label:'Column'},{v:'row',label:'Row'}], p.direction, v=>p.direction=v));
    group('Gap', rangeField(p.gap,0,60,1,'px', v=>p.gap=v));
    group('Padding', rangeField(p.padding,0,60,1,'px', v=>p.padding=v));
    group('Align items', segField([{v:'flex-start',label:'Start'},{v:'center',label:'Center'},{v:'stretch',label:'Stretch'}], p.align, v=>p.align=v));
    group('Justify', segField([{v:'flex-start',label:'Start'},{v:'center',label:'Center'},{v:'space-between',label:'Between'}], p.justify, v=>p.justify=v));
    if(!isRoot) group('Min height', rangeField(p.minH,0,300,4,'px', v=>p.minH=v));
    group('Background', colorField(p.bg==='transparent'?'#12121a':p.bg, v=>p.bg=v));
  }
  else if(block.type==='heading' || block.type==='text'){
    group('Content', textField(p.content, v=>p.content=v));
    if(block.type==='heading') group('Tag', selectField(['h1','h2','h3','h4','h5','h6'], p.tag||'h2', v=>p.tag=v));
    group('Font size', rangeField(p.fontSize,10,56,1,'px', v=>p.fontSize=v));
    group('Weight', segField([{v:400,label:'Regular'},{v:600,label:'Medium'},{v:800,label:'Bold'}], p.weight, v=>p.weight=v));
    group('Align', segField([{v:'left',label:'Left'},{v:'center',label:'Center'},{v:'right',label:'Right'}], p.align, v=>p.align=v));
    group('Color', colorField(/var\(/.test(p.color)?'#f2f2f7':p.color, v=>p.color=v));
  }
  else if(block.type==='button'){
    const box = document.createElement('div'); box.className='fieldFull';
    const inp = document.createElement('input'); inp.type='text'; inp.value=p.label;
    inp.oninput = ()=>{ p.label=inp.value; renderCanvasOnly(); };
    box.appendChild(inp);
    group('Label', box);
    group('Background', colorField(p.bg, v=>p.bg=v));
    group('Text color', colorField(p.color, v=>p.color=v));
    group('Corner radius', rangeField(p.radius,0,40,1,'px', v=>p.radius=v));
    group('Padding X', rangeField(p.padX,4,50,1,'px', v=>p.padX=v));
    group('Padding Y', rangeField(p.padY,4,30,1,'px', v=>p.padY=v));
    group('Font size', rangeField(p.fontSize,10,26,1,'px', v=>p.fontSize=v));
    group('Alignment', segField([{v:'left',label:'Left'},{v:'center',label:'Center'},{v:'right',label:'Right'}], p.align, v=>p.align=v));
  }
  else if(block.type==='link'){
    const box = document.createElement('div'); box.className='fieldFull';
    const inp = document.createElement('input'); inp.type='text'; inp.value=p.content;
    inp.oninput = ()=>{ p.content=inp.value; renderCanvasOnly(); };
    box.appendChild(inp);
    group('Label', box);
    const box2 = document.createElement('div'); box2.className='fieldFull';
    const inp2 = document.createElement('input'); inp2.type='text'; inp2.value=p.href; inp2.placeholder='https://…';
    inp2.oninput = ()=>{ p.href=inp2.value; };
    box2.appendChild(inp2);
    group('URL', box2);
    group('Color', colorField(p.color, v=>p.color=v));
    group('Font size', rangeField(p.fontSize,10,28,1,'px', v=>p.fontSize=v));
    group('Underline', toggleField(p.underline, v=>p.underline=v));
    group('Align', segField([{v:'left',label:'Left'},{v:'center',label:'Center'},{v:'right',label:'Right'}], p.align, v=>p.align=v));
  }
  else if(block.type==='image'){
    const box = document.createElement('div'); box.className='fieldFull';
    const inp = document.createElement('input'); inp.type='text'; inp.value=p.src; inp.placeholder='Image URL';
    inp.oninput = ()=>{ p.src=inp.value; renderCanvasOnly(); };
    box.appendChild(inp);
    group('Image URL', box);
    group('Width', rangeField(p.width,10,100,1,'%', v=>p.width=v));
    group('Corner radius', rangeField(p.radius,0,40,1,'px', v=>p.radius=v));
    group('Fit', segField([{v:'cover',label:'Cover'},{v:'contain',label:'Contain'},{v:'fill',label:'Fill'}], p.fit||'cover', v=>p.fit=v));
  }
  else if(block.type==='video'){
    const box = document.createElement('div'); box.className='fieldFull';
    const inp = document.createElement('input'); inp.type='text'; inp.value=p.src; inp.placeholder='Video URL (.mp4)';
    inp.oninput = ()=>{ p.src=inp.value; renderCanvasOnly(); };
    box.appendChild(inp);
    group('Video URL', box);
    group('Width', rangeField(p.width,10,100,1,'%', v=>p.width=v));
    group('Corner radius', rangeField(p.radius,0,40,1,'px', v=>p.radius=v));
    group('Show controls', toggleField(p.controls, v=>p.controls=v));
  }
  else if(block.type==='list'){
    group('Items (one per line)', textField(p.items.join('\n'), v=>p.items=v.split('\n').filter(x=>x.length)));
    group('Style', segField([{v:false,label:'Bullets'},{v:true,label:'Numbered'}], p.ordered, v=>p.ordered=v));
    group('Font size', rangeField(p.fontSize,10,28,1,'px', v=>p.fontSize=v));
    group('Row gap', rangeField(p.gap,0,30,1,'px', v=>p.gap=v));
    group('Color', colorField(/var\(/.test(p.color)?'#f2f2f7':p.color, v=>p.color=v));
  }
  else if(block.type==='quote'){
    group('Content', textField(p.content, v=>p.content=v));
    group('Font size', rangeField(p.fontSize,12,32,1,'px', v=>p.fontSize=v));
    group('Color', colorField(/var\(/.test(p.color)?'#f2f2f7':p.color, v=>p.color=v));
    group('Accent border', colorField(p.borderColor, v=>p.borderColor=v));
  }
  else if(block.type==='code'){
    group('Code', textField(p.content, v=>p.content=v));
    group('Font size', rangeField(p.fontSize,10,22,1,'px', v=>p.fontSize=v));
    group('Text color', colorField(p.color, v=>p.color=v));
    group('Background', colorField(p.bg, v=>p.bg=v));
  }
  else if(block.type==='table'){
    group('Rows (comma cols, one row per line)', textField(p.rows.map(r=>r.join(', ')).join('\n'), v=>p.rows=v.split('\n').filter(x=>x.length).map(r=>r.split(',').map(c=>c.trim()))));
    group('First row is header', toggleField(p.header, v=>p.header=v));
    group('Text color', colorField(/var\(/.test(p.color)?'#f2f2f7':p.color, v=>p.color=v));
  }
  else if(block.type==='input' || block.type==='textarea'){
    const box = document.createElement('div'); box.className='fieldFull';
    const inp = document.createElement('input'); inp.type='text'; inp.value=p.label;
    inp.oninput = ()=>{ p.label=inp.value; renderCanvasOnly(); };
    box.appendChild(inp);
    group('Field label', box);
    const box2 = document.createElement('div'); box2.className='fieldFull';
    const inp2 = document.createElement('input'); inp2.type='text'; inp2.value=p.placeholder;
    inp2.oninput = ()=>{ p.placeholder=inp2.value; renderCanvasOnly(); };
    box2.appendChild(inp2);
    group('Placeholder', box2);
  }
  else if(block.type==='checkbox'){
    const box = document.createElement('div'); box.className='fieldFull';
    const inp = document.createElement('input'); inp.type='text'; inp.value=p.label;
    inp.oninput = ()=>{ p.label=inp.value; renderCanvasOnly(); };
    box.appendChild(inp);
    group('Label', box);
    group('Checked by default', toggleField(p.checked, v=>p.checked=v));
  }
  else if(block.type==='badge'){
    const box = document.createElement('div'); box.className='fieldFull';
    const inp = document.createElement('input'); inp.type='text'; inp.value=p.label;
    inp.oninput = ()=>{ p.label=inp.value; renderCanvasOnly(); };
    box.appendChild(inp);
    group('Label', box);
    group('Background', colorField(p.bg, v=>p.bg=v));
    group('Text color', colorField(p.color, v=>p.color=v));
  }
  else if(block.type==='alert'){
    group('Message', textField(p.content, v=>p.content=v));
    group('Variant', segField([{v:'info',label:'Info'},{v:'success',label:'Success'},{v:'warning',label:'Warning'},{v:'danger',label:'Danger'}], p.variant, v=>p.variant=v));
  }
  else if(block.type==='progress'){
    group('Value', rangeField(p.value,0,100,1,'%', v=>p.value=v));
    group('Height', rangeField(p.height,4,30,1,'px', v=>p.height=v));
    group('Bar color', colorField(p.color, v=>p.color=v));
    group('Track color', colorField(p.track, v=>p.track=v));
  }
  else if(block.type==='icon'){
    const box = document.createElement('div'); box.className='fieldFull';
    const inp = document.createElement('input'); inp.type='text'; inp.value=p.glyph; inp.maxLength=4;
    inp.oninput = ()=>{ p.glyph=inp.value; renderCanvasOnly(); };
    box.appendChild(inp);
    group('Glyph / emoji', box);
    group('Size', rangeField(p.size,12,80,1,'px', v=>p.size=v));
    group('Color', colorField(p.color, v=>p.color=v));
    group('Align', segField([{v:'left',label:'Left'},{v:'center',label:'Center'},{v:'right',label:'Right'}], p.align, v=>p.align=v));
  }
  else if(block.type==='divider'){
    group('Thickness', rangeField(p.thickness,1,10,1,'px', v=>p.thickness=v));
    group('Spacing', rangeField(p.margin,0,50,1,'px', v=>p.margin=v));
    group('Color', colorField(/var\(/.test(p.color)?'#333340':p.color, v=>p.color=v));
  }
  else if(block.type==='spacer'){
    group('Height', rangeField(p.height,4,160,2,'px', v=>p.height=v));
  }

  if(!isRoot && p.adv){
    const adv = p.adv;
    const advTitle = document.createElement('div');
    advTitle.style.cssText = 'font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:18px 0 10px;border-top:1px solid var(--border);padding-top:16px;';
    advTitle.textContent = 'Advanced style';
    body.appendChild(advTitle);
    group('Margin top', rangeField(adv.mt,0,80,1,'px', v=>adv.mt=v));
    group('Margin bottom', rangeField(adv.mb,0,80,1,'px', v=>adv.mb=v));
    group('Opacity', rangeField(adv.opacity,10,100,1,'%', v=>adv.opacity=v));
    group('Wrapper radius', rangeField(adv.radius,0,40,1,'px', v=>adv.radius=v));
    group('Border width', rangeField(adv.borderW,0,10,1,'px', v=>adv.borderW=v));
    if(adv.borderW>0){
      group('Border style', selectField(['solid','dashed','dotted'], adv.borderStyle, v=>adv.borderStyle=v));
      group('Border color', colorField(adv.borderColor, v=>adv.borderColor=v));
    }
    group('Drop shadow', toggleField(adv.shadow, v=>adv.shadow=v));
    if(adv.shadow){
      group('Shadow blur', rangeField(adv.shadowBlur,0,60,1,'px', v=>adv.shadowBlur=v));
      group('Shadow offset Y', rangeField(adv.shadowY,0,40,1,'px', v=>adv.shadowY=v));
      group('Shadow color', colorField(adv.shadowColor, v=>adv.shadowColor=v));
    }
  }

  if(!isRoot){
    const del = document.createElement('button');
    del.className = 'deleteFull';
    del.textContent = '🗑 Delete block';
    del.onclick = ()=> deleteBlock(block.id);
    body.appendChild(del);
  }
}
function blockLabel(type){
  const def = blockDefs.find(d=>d.type===type);
  return def ? def.ic+' '+def.label : type;
}
function renderCanvasOnly(){ renderCanvasTree(); }

/* ================= DEVICE / THEME / PREVIEW ================= */
function setDevice(d){
  device = d;
  $('devWeb').classList.toggle('active', d==='web');
  $('devMobile').classList.toggle('active', d==='mobile');
  const frame = $('deviceFrame');
  frame.className = 'deviceFrame ' + d;
  $('webChrome').style.display = d==='web' ? 'flex' : 'none';
  $('phoneNotch').style.display = d==='mobile' ? 'block' : 'none';
  $('statusBar').style.display = d==='mobile' ? 'flex' : 'none';
}
function toggleTheme(){
  const html = document.documentElement;
  const isLight = html.getAttribute('data-theme')==='light';
  html.setAttribute('data-theme', isLight?'dark':'light');
  $('themeBtn').textContent = isLight ? '🌙' : '☀️';
  localStorage.setItem('blockCraftTheme', isLight?'dark':'light');
}
(function initTheme(){
  const saved = localStorage.getItem('blockCraftTheme');
  if(saved==='light'){ document.documentElement.setAttribute('data-theme','light'); }
})();
function togglePreview(){
  previewMode = !previewMode;
  $('layout').classList.toggle('preview', previewMode);
  $('previewBtnTop').classList.toggle('active', previewMode);
  render();
}
function clearSelectionHint(){ flash('Tip: use Preview 👁 to see your page without edit handles'); }

/* ================= SAVE / LOAD ================= */
const SAVE_KEY = 'blockCraftSaves';
function getSaves(){ try{ return JSON.parse(localStorage.getItem(SAVE_KEY))||[]; }catch(_){ return []; } }
function setSaves(list){ localStorage.setItem(SAVE_KEY, JSON.stringify(list)); }
function newProject(){
  if(root.children.length && !confirm('Start a new page? Unsaved changes will be lost.')) return;
  root = makeContainer('column', {padding:24, gap:18, minH:400, bg:'transparent'});
  selectedId = 'root';
  render();
}
function saveProject(){
  const name = prompt('Name this page:', 'My Page');
  if(!name) return;
  const list = getSaves();
  list.push({id:Date.now(), name, tree: JSON.parse(JSON.stringify(root))});
  setSaves(list);
  renderSaved();
  flash('Page saved!');
}
function renderSaved(){
  const list = getSaves();
  const wrap = $('savedList');
  if(list.length===0){
    wrap.innerHTML = '<div class="emptyNote">No saved pages yet. Build something and click "Save" above.</div>';
    return;
  }
  wrap.innerHTML = '';
  list.slice().reverse().forEach(item=>{
    const row = document.createElement('div');
    row.className = 'savedItem';
    row.innerHTML = `<span class="name">${escapeHtml(item.name)}</span><button title="Load">📂</button><button class="del" title="Delete">🗑</button>`;
    row.querySelector('button[title="Load"]').onclick = ()=>{ root = JSON.parse(JSON.stringify(item.tree)); selectedId='root'; render(); flash('Loaded'); };
    row.querySelector('.del').onclick = ()=>{ setSaves(getSaves().filter(x=>x.id!==item.id)); renderSaved(); };
    wrap.appendChild(row);
  });
}
function escapeHtml(s){ return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function flash(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(flash._t);
  flash._t = setTimeout(()=> t.classList.remove('show'), 1600);
}

/* ================= INIT ================= */
renderPalette();
renderSaved();
render();
</script>
</body>
</html>
